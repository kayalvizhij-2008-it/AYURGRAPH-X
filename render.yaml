services:
  - type: web
    name: ayurgraph-x-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: '["*"]'
